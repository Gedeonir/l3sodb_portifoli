<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navbar Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 40px;
      background: #0f172a; /* dark blue */
      color: white;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-size: 16px;
      transition: color 0.3s;
    }

    .menu a:hover {
      color: #38bdf8; /* light blue */
    }

    .slogan {
      font-size: 14px;
      opacity: 0.8;
    }

    .profile-pic img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #38bdf8;
    }
  </style>
</head>
<body>

  <nav>
    <!-- Left -->
    <div class="logo">ABOUT</div>

    <!-- Center -->
    <div class="menu">
      <span class="slogan">Turn ideas into reality</span>
      <a href="#">Show</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>

    <!-- Right -->
    <div class="profile-pic">
      <img src="https://via.placeholder.com/150" alt="Profile Picture">
    </div>
  </nav>

</body>
</html>
