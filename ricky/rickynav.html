<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern Navbar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        /* NAVBAR */
        nav {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00ffd5;
            letter-spacing: 1px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        .nav-links li a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            position: relative;
            transition: 0.3s;
        }

        .nav-links li a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 2px;
            background: #00ffd5;
            left: 0;
            bottom: -5px;
            transition: 0.3s;
        }

        .nav-links li a:hover {
            color: #00ffd5;
        }

        .nav-links li a:hover::after {
            width: 100%;
        }

        /* MENU ICON */
        .menu-btn {
            display: none;
            font-size: 26px;
            color: white;
            cursor: pointer;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .menu-btn {
                display: block;
            }

            .nav-links {
                position: absolute;
                top: 70px;
                right: 0;
                width: 100%;
                background: rgba(0,0,0,0.9);
                flex-direction: column;
                align-items: center;
                gap: 20px;
                padding: 20px 0;
                display: none;
                animation: slideDown 0.4s ease;
            }

            .nav-links.active {
                display: flex;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* DEMO CONTENT */
        .hero {
            color: white;
            text-align: center;
            margin-top: 120px;
            font-size: 28px;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">Adelte</div>

    <ul class="nav-links" id="navLinks">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">Login</a></li>
    </ul>

    <div class="menu-btn" onclick="toggleMenu()">☰</div>
</nav>

<div class="hero">
    🚀 Welcome to Your Website <br>
    Clean • Responsive • Animated
</div>

<script>
    function toggleMenu() {
        document.getElementById("navLinks").classList.toggle("active");
    }
</script>

</body>
</html>
